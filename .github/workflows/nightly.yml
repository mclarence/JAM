name: Nightly

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"

# A newer push supersedes an in-flight nightly.
concurrency:
  group: nightly
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      release_id: ${{ steps.release.outputs.release_id }}
    steps:
      - uses: actions/checkout@v4

      - name: Compute nightly version
        id: version
        run: |
          base=$(jq -r .version src-tauri/tauri.conf.json | sed 's/-.*//')
          echo "version=${base}-nightly.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

      # Replaces the rolling release so latest.json only ever describes the newest build.
      - name: Recreate the nightly release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete nightly --cleanup-tag --yes || true
          gh release create nightly \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "Nightly ${{ steps.version.outputs.version }}" \
            --notes "Automated build of ${GITHUB_SHA} (${{ steps.version.outputs.version }})."
          id=$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/nightly" --jq .id)
          echo "release_id=${id}" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    strategy:
      fail-fast: false
      # tauri-action merges each platform into one latest.json; parallel jobs would race on it.
      max-parallel: 1
      matrix:
        include:
          - os: macos-latest
            args: --target aarch64-apple-darwin --bundles app,dmg
            rust_targets: aarch64-apple-darwin
          - os: windows-latest
            args: --bundles nsis
            rust_targets: ""
          - os: ubuntu-22.04
            args: --bundles appimage
            rust_targets: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libdbus-1-dev pkg-config libssl-dev

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_targets }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: pnpm install --frozen-lockfile

      - name: Stamp version
        run: node .github/scripts/set-version.mjs "${{ needs.prepare.outputs.version }}"

      - name: Configure macOS signing
        if: runner.os == 'macOS'
        shell: bash
        env:
          CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          : "${CERTIFICATE:?Set the MACOS_CERTIFICATE_P12 repository secret}"
          : "${CERTIFICATE_PASSWORD:?Set the MACOS_CERTIFICATE_PASSWORD repository secret}"
          : "${SIGNING_IDENTITY:?Set the MACOS_SIGNING_IDENTITY repository secret}"
          umask 077

          keychain="$RUNNER_TEMP/jam-signing.keychain-db"
          password="$(openssl rand -hex 32)"
          echo "::add-mask::$password"

          printf '%s' "$CERTIFICATE" |
            base64 --decode > "$RUNNER_TEMP/jam-signing.p12"

          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security list-keychains -d user -s "$keychain"
          security import "$RUNNER_TEMP/jam-signing.p12" \
            -k "$keychain" -P "$CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: -s -k "$password" "$keychain"

          # Self-signed identities need an explicit code-signing trust anchor on this disposable runner.
          security find-certificate -c "$SIGNING_IDENTITY" -p "$keychain" \
            > "$RUNNER_TEMP/jam-signing.pem"
          sudo security add-trusted-cert \
            -d -r trustRoot -p codeSign \
            -k /Library/Keychains/System.keychain "$RUNNER_TEMP/jam-signing.pem"

          if ! security find-identity -v -p codesigning "$keychain" |
            grep -F "\"$SIGNING_IDENTITY\"" > /dev/null; then
            echo "::error::MACOS_SIGNING_IDENTITY is not a valid imported code-signing identity"
            exit 1
          fi

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_SIGNING_IDENTITY: ${{ runner.os == 'macOS' && secrets.MACOS_SIGNING_IDENTITY || '' }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Optional: without a client ID, settings sync shows as unavailable.
          JAM_GOOGLE_CLIENT_ID: ${{ secrets.JAM_GOOGLE_CLIENT_ID }}
          JAM_GOOGLE_CLIENT_SECRET: ${{ secrets.JAM_GOOGLE_CLIENT_SECRET }}
        with:
          tauriScript: pnpm tauri
          releaseId: ${{ needs.prepare.outputs.release_id }}
          # Without tagName, latest.json would link to /releases/latest/, which never points at a prerelease.
          tagName: nightly
          prerelease: true
          uploadUpdaterJson: true
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }}

      - name: Clean up macOS signing
        if: always() && runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f "$RUNNER_TEMP/jam-signing.keychain-db" ]]; then
            security delete-keychain "$RUNNER_TEMP/jam-signing.keychain-db"
          fi
          rm -f "$RUNNER_TEMP/jam-signing.p12" "$RUNNER_TEMP/jam-signing.pem"
