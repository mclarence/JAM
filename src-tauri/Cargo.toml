[package]
name = "jira-assets-manager"
version = "1.1.0"
description = "IT Asset Management desktop client for JIRA Assets"
edition = "2021"

[lib]
name = "jam_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-store = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-updater = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-native-roots", "cookies"] }
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }
base64 = "0.22"
argon2 = "0.5"
chacha20poly1305 = "0.10"
getrandom = "0.3"
zeroize = "1"
thiserror = "2"
url = "2"
tokio = { version = "1", features = ["rt", "net", "io-util", "time", "macros", "sync"] }
sha2 = "0.10"
rusqlite = { version = "0.42.0", features = ["bundled", "functions"] }
chrono = { version = "0.4.45", default-features = false, features = ["std", "clock"] }
chrono-tz = "0.10.4"
